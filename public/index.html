<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Foot/Scan</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #0c0a09;
      color: #fafaf9;
      font-family: Arial, Helvetica, sans-serif;
    }

    .wrap {
      max-width: 760px;
      margin: 0 auto;
      padding: 22px 16px 60px;
    }

    .header {
      border-bottom: 1px solid #292524;
      background: linear-gradient(180deg, rgba(127, 29, 29, 0.35), transparent);
      margin-bottom: 22px;
    }

    h1 {
      margin: 0;
      font-size: 44px;
      letter-spacing: 1px;
    }

    h1 span {
      color: #ef4444;
    }

    p {
      color: #a8a29e;
      margin: 8px 0 0;
      line-height: 1.4;
    }

    code {
      color: #e7e5e4;
      font-family: monospace;
    }

    label {
      display: block;
      margin: 16px 0 7px;
      font-size: 11px;
      color: #78716c;
      text-transform: uppercase;
      letter-spacing: 1.6px;
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 14px;
      border-radius: 10px;
      border: 1px solid #292524;
      background: #1c1917;
      color: #fafaf9;
      outline: none;
      font-size: 15px;
    }

    input:focus {
      border-color: #ef4444;
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .skip {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 6px;
    }

    .skip button {
      padding: 10px 0;
      border-radius: 8px;
      border: 1px solid #292524;
      background: #1c1917;
      color: #a8a29e;
      font-weight: bold;
    }

    .skip button.active {
      background: #dc2626;
      color: white;
      border-color: #dc2626;
    }

    .scan {
      margin-top: 20px;
      width: 100%;
      padding: 17px;
      border: 0;
      border-radius: 12px;
      background: #dc2626;
      color: white;
      font-size: 24px;
      font-weight: bold;
      letter-spacing: 1px;
    }

    .scan:disabled {
      background: #44403c;
    }

    .box {
      border: 1px solid #292524;
      background: rgba(28, 25, 23, 0.75);
      border-radius: 12px;
      padding: 14px;
      margin-top: 16px;
    }

    .status {
      color: #fbbf24;
      border-color: #78350f;
      background: rgba(120, 53, 15, 0.25);
      font-size: 14px;
      line-height: 1.4;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .error {
      color: #fca5a5;
      border-color: #7f1d1d;
      background: rgba(127, 29, 29, 0.35);
      word-break: break-word;
      white-space: pre-wrap;
    }

    .team {
      overflow: hidden;
      padding: 0;
    }

    .teamHead {
      padding: 14px;
      border-bottom: 1px solid #292524;
      background: linear-gradient(90deg, #1c1917, rgba(127, 29, 29, 0.25));
    }

    .side {
      font-size: 11px;
      color: #78716c;
      text-transform: uppercase;
      letter-spacing: 1.6px;
      margin-bottom: 4px;
    }

    .teamName {
      font-size: 26px;
      font-weight: bold;
    }

    .values {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1px;
      background: #292524;
    }

    .values.one {
      grid-template-columns: 1fr;
    }

    .valueCell {
      background: #1c1917;
      padding: 14px;
    }

    .rankLabel {
      color: #f87171;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 6px;
    }

    .score {
      font-size: 38px;
      font-weight: bold;
    }

    .source {
      margin-top: 9px;
      padding-top: 9px;
      border-top: 1px solid #292524;
      font-size: 12px;
      color: #a8a29e;
      line-height: 1.35;
    }

    .source small {
      color: #78716c;
      display: block;
      margin-top: 2px;
    }

    .sectionTitle {
      font-size: 11px;
      color: #78716c;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      margin: 14px 14px 8px;
      font-weight: bold;
    }

    .list {
      padding: 0 14px 14px;
      font-size: 13px;
      color: #d6d3d1;
    }

    .row {
      display: flex;
      gap: 8px;
      padding: 7px 0;
      border-bottom: 1px solid rgba(41, 37, 36, 0.65);
    }

    .row:last-child {
      border-bottom: 0;
    }

    .num {
      color: #78716c;
      min-width: 34px;
      text-align: right;
      font-family: monospace;
    }

    .min {
      color: #a8a29e;
      min-width: 46px;
      font-family: monospace;
    }

    .grow {
      flex: 1;
      min-width: 0;
    }

    .eventTitle {
      color: #fafaf9;
    }

    .eventSub {
      color: #78716c;
      font-size: 12px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .plus {
      color: #34d399;
      font-family: monospace;
      font-weight: bold;
    }

    .minus {
      color: #f87171;
      font-family: monospace;
      font-weight: bold;
    }

    details {
      margin-top: 14px;
    }

    summary {
      cursor: pointer;
      color: #a8a29e;
      padding: 12px 14px;
      border-top: 1px solid #292524;
      font-size: 13px;
    }

    .bar {
      color: #a8a29e;
      font-size: 13px;
      line-height: 1.7;
    }

    .vs {
      text-align: center;
      color: #78716c;
      font-weight: bold;
      margin: 18px 0;
    }
  </style>
</head>

<body>
  <div class="header">
    <div class="wrap">
      <h1>Foot<span>/</span>Scan</h1>
      <p>Compare deux équipes avec les événements de leurs derniers matchs SofaScore.</p>
    </div>
  </div>

  <main class="wrap">
    <div class="box">
      <strong>Mode worker local</strong>
      <p>Garde Termux ouvert avec <code>python scripts/local_worker.py</code> pendant le scan.</p>
    </div>

    <label for="matchInput">URL SofaScore ou Match ID</label>
    <input id="matchInput" placeholder="Ex: 14023959 ou lien SofaScore" />

    <div class="grid">
      <div>
        <label for="rank1">Rang 1</label>
        <input id="rank1" placeholder="Ex: 52.5" inputmode="decimal" />
      </div>

      <div>
        <label for="rank2">Rang 2 optionnel</label>
        <input id="rank2" placeholder="Ex: 79.5 ou vide" inputmode="decimal" />
      </div>
    </div>

    <div class="grid">
      <div>
        <label>Ignorer domicile</label>
        <div class="skip" id="skipHome"></div>
      </div>

      <div>
        <label>Ignorer extérieur</label>
        <div class="skip" id="skipAway"></div>
      </div>
    </div>

    <button class="scan" id="scanBtn">Scanner →</button>

    <div id="statusBox" class="box status" style="display:none;"></div>
    <div id="errorBox" class="box error" style="display:none;"></div>
    <div id="result"></div>

    <details class="box">
      <summary>Barème</summary>
      <div class="bar">
        But + passe : +1.5<br />
        But : +1<br />
        Passe décisive : +0.5<br />
        Jaune : −0.5<br />
        Rouge direct : −1<br />
        2ᵉ jaune : −1.5
      </div>
    </details>
  </main>

  <script>
    const VALUES = {
      goal: 1,
      goalWithAssist: 1.5,
      assist: 0.5,
      yellow: -0.5,
      secondYellow: -1.5,
      red: -1,
    };

    const LABELS = {
      goal: "But",
      goalWithAssist: "But + passe",
      assist: "Passe décisive",
      yellow: "Jaune",
      secondYellow: "2ᵉ jaune",
      red: "Rouge direct",
    };

    let skipHomeValue = 0;
    let skipAwayValue = 0;

    const $ = (id) => document.getElementById(id);

    function esc(value) {
      return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function sleep(ms) {
      return new Promise((resolve) => setTimeout(resolve, ms));
    }

    function setStatus(message) {
      const box = $("statusBox");
      box.style.display = message ? "block" : "none";
      box.textContent = message || "";
    }

    function setError(message) {
      const box = $("errorBox");
      box.style.display = message ? "block" : "none";
      box.textContent = message || "";
    }

    function extractMatchId(input) {
      const s = String(input || "").trim();

      if (/^\d+$/.test(s)) return s;

      const found =
        s.match(/#id:(\d+)/) ||
        s.match(/\/event\/(\d+)/) ||
        s.match(/\/(\d+)(?:[/?#]|$)/);

      return found ? found[1] : s;
    }

    function formatDateFromTimestamp(timestamp) {
      if (!timestamp) return "";

      const d = new Date(timestamp * 1000);
      const dd = String(d.getDate()).padStart(2, "0");
      const mm = String(d.getMonth() + 1).padStart(2, "0");
      const yy = String(d.getFullYear()).slice(-2);

      return `${dd}.${mm}.${yy}`;
    }

    async function fetchJSON(path) {
      const maxAttempts = 240;

      for (let attempt = 1; attempt <= maxAttempts; attempt++) {
        setStatus(`Chargement SofaScore : ${path}\nTentative ${attempt}/${maxAttempts}`);

        let res;
        let text;

        try {
          res = await fetch(`/api/sofa?path=${encodeURIComponent(path)}&_=${Date.now()}`, {
            cache: "no-store",
          });

          text = await res.text();
        } catch (networkError) {
          setStatus(
            `Connexion instable sur : ${path}\nNouvelle tentative dans 2 secondes…`
          );

          await sleep(2000);
          continue;
        }

        let data;

        try {
          data = JSON.parse(text);
        } catch {
          setStatus(
            `Réponse invalide sur : ${path}\nNouvelle tentative dans 2 secondes…`
          );

          await sleep(2000);
          continue;
        }

        if (res.status === 202) {
          await sleep(data.retryAfter || 1000);
          continue;
        }

        if (!res.ok) {
          const msg = data.error || `HTTP ${res.status} sur ${path}`;

          setStatus(`${msg}\nNouvelle tentative dans 2 secondes…`);
          await sleep(2000);
          continue;
        }

        return data;
      }

      throw new Error(
        "Données pas encore prêtes. Vérifie que Termux est ouvert et que le worker tourne."
      );
    }

    async function fetchMatch(id) {
      const data = await fetchJSON(`event/${id}`);
      const event = data.event || data;

      if (!event || !event.homeTeam || !event.awayTeam) {
        throw new Error("Format du match inattendu.");
      }

      return event;
    }

    async function fetchIncidents(id) {
      const data = await fetchJSON(`event/${id}/incidents`);
      return data.incidents || (Array.isArray(data) ? data : []);
    }

    async function fetchTeamLast(teamId, page = 0) {
      const data = await fetchJSON(`team/${teamId}/events/last/${page}`);
      return data.events || (Array.isArray(data) ? data : []);
    }

    function parseIncidents(incidents, matchLabel, matchId) {
      const events = [];

      for (const inc of incidents) {
        const minute = inc.time;
        const added = inc.addedTime || 0;

        if (minute == null || minute < 1 || minute > 90) continue;

        const minuteLabel = added ? `${minute}+${added}'` : `${minute}'`;

        if (inc.incidentType === "goal") {
          const scorer = inc.player?.name || "—";
          const assister = inc.assist1?.name || null;

          events.push({
            type: assister ? "goalWithAssist" : "goal",
            value: assister ? VALUES.goalWithAssist : VALUES.goal,
            minute,
            added,
            minuteLabel,
            match: matchLabel,
            matchId,
            detail: assister ? `${scorer} — passe : ${assister}` : scorer,
          });

          if (assister) {
            events.push({
              type: "assist",
              value: VALUES.assist,
              minute,
              added,
              minuteLabel,
              match: matchLabel,
              matchId,
              detail: `${assister} → ${scorer}`,
            });
          }
        }

        if (inc.incidentType === "card") {
          if (!inc.player?.id) continue;

          let type = null;

          if (inc.incidentClass === "yellow") type = "yellow";
          if (inc.incidentClass === "yellowRed") type = "secondYellow";
          if (inc.incidentClass === "red") type = "red";

          if (!type) continue;

          events.push({
            type,
            value: VALUES[type],
            minute,
            added,
            minuteLabel,
            match: matchLabel,
            matchId,
            detail: inc.player.name || "—",
          });
        }
      }

      events.sort((a, b) => {
        const aa = a.minute + (a.added || 0) / 100;
        const bb = b.minute + (b.added || 0) / 100;

        if (bb !== aa) return bb - aa;

        const order = {
          goalWithAssist: 0,
          goal: 0,
          assist: 1,
          yellow: 2,
          secondYellow: 2,
          red: 2,
        };

        return (order[a.type] ?? 9) - (order[b.type] ?? 9);
      });

      return events;
    }

    function valueAtRank(events, rank) {
      if (!rank || rank < 1) return { value: null, sources: [] };

      if (Number.isInteger(rank)) {
        const event = events[rank - 1];

        if (!event) return { value: null, sources: [] };

        return {
          value: event.value,
          sources: [event],
        };
      }

      const lo = Math.floor(rank) - 1;
      const hi = lo + 1;

      if (!events[lo] || !events[hi]) {
        return { value: null, sources: [] };
      }

      return {
        value: (events[lo].value + events[hi].value) / 2,
        sources: [events[lo], events[hi]],
      };
    }

    async function scanTeam(teamId, skip, maxNeeded, teamName) {
      const maxMatchesPerTeam = 15;
      const pagesToLoad = 6;

      const byId = new Map();

      for (let page = 0; page < pagesToLoad; page++) {
        setStatus(
          `${teamName}\nRécupération des derniers matchs\nPage SofaScore ${page + 1}/${pagesToLoad}`
        );

        const matches = await fetchTeamLast(teamId, page);

        for (const match of matches) {
          if (!match?.id) continue;

          const isFinished = match.status?.type === "finished";
          const isTeamMatch =
            match.homeTeam?.id === teamId || match.awayTeam?.id === teamId;

          if (!isFinished || !isTeamMatch) continue;

          byId.set(match.id, match);
        }
      }

      const sortedMatches = [...byId.values()].sort((a, b) => {
        const ta = a.startTimestamp || 0;
        const tb = b.startTimestamp || 0;

        return tb - ta;
      });

      const selectedMatches = sortedMatches
        .slice(skip)
        .slice(0, maxMatchesPerTeam);

      const allEvents = [];
      const matchesUsed = [];

      for (let i = 0; i < selectedMatches.length; i++) {
        const match = selectedMatches[i];

        const date = formatDateFromTimestamp(match.startTimestamp);
        const label = `${date ? date + " · " : ""}${match.homeTeam?.name || "?"} ${match.homeScore?.current ?? "-"}-${match.awayScore?.current ?? "-"} ${match.awayTeam?.name || "?"}`;

        setStatus(
          `${teamName}\nMatch ${i + 1}/${selectedMatches.length}\n${label}\nÉvénements trouvés : ${allEvents.length}/${maxNeeded}`
        );

        const incidents = await fetchIncidents(match.id);
        const events = parseIncidents(incidents, label, match.id);

        allEvents.push(...events);

        matchesUsed.push({
          id: match.id,
          label,
          count: events.length,
          startTimestamp: match.startTimestamp || 0,
        });
      }

      return {
        events: allEvents,
        matchesUsed,
      };
    }

    function renderValue(label, result) {
      const value = result?.value;
      const sources = result?.sources || [];

      let html = `
        <div class="valueCell">
          <div class="rankLabel">${esc(label)}</div>
          <div class="score">${value == null ? "—" : esc((value > 0 ? "+" : "") + value)}</div>
      `;

      if (sources.length) {
        html += `<div class="source">`;

        for (const source of sources) {
          html += `
            <div>${esc(source.match)}</div>
            <small>${esc(source.minuteLabel)} · ${esc(LABELS[source.type])} · ${esc((source.value > 0 ? "+" : "") + source.value)}</small>
          `;
        }

        html += `</div>`;
      }

      html += `</div>`;

      return html;
    }

    function renderTeam(team, side, rank1, rank2) {
      const eventRows = team.events.map((ev, index) => `
        <div class="row">
          <div class="num">#${index + 1}</div>
          <div class="min">${esc(ev.minuteLabel)}</div>
          <div class="grow">
            <div class="eventTitle">${esc(LABELS[ev.type])}</div>
            <div class="eventSub">${esc(ev.detail)} · ${esc(ev.match)}</div>
          </div>
          <div class="${ev.value > 0 ? "plus" : "minus"}">${esc((ev.value > 0 ? "+" : "") + ev.value)}</div>
        </div>
      `).join("");

      const matchRows = team.matchesUsed.map((m, index) => `
        <div class="row">
          <div class="num">${index + 1}.</div>
          <div class="grow">${esc(m.label)}</div>
          <div class="num">${esc(m.count)}</div>
        </div>
      `).join("");

      return `
        <div class="box team">
          <div class="teamHead">
            <div class="side">${esc(side)}</div>
            <div class="teamName">${esc(team.name)}</div>
          </div>

          <div class="values ${rank2 ? "" : "one"}">
            ${renderValue(`Rang ${rank1}`, team.r1)}
            ${rank2 ? renderValue(`Rang ${rank2}`, team.r2) : ""}
          </div>

          <div class="sectionTitle">Matchs utilisés (${team.matchesUsed.length})</div>
          <div class="list">${matchRows || "Aucun match trouvé."}</div>

          <details>
            <summary>Événements trouvés (${team.events.length})</summary>
            <div class="list">${eventRows || "Aucun événement trouvé."}</div>
          </details>
        </div>
      `;
    }

    async function handleScan() {
      setError("");
      setStatus("");
      $("result").innerHTML = "";

      const matchId = extractMatchId($("matchInput").value);
      const rank1 = parseFloat(String($("rank1").value).replace(",", "."));
      const rank2Raw = String($("rank2").value || "").trim();
      const rank2 = rank2Raw ? parseFloat(rank2Raw.replace(",", ".")) : null;

      if (!matchId || !rank1 || rank1 < 1) {
        setError("Mets un Match ID ou une URL SofaScore, puis un rang 1 supérieur ou égal à 1.");
        return;
      }

      if (rank2 !== null && (!rank2 || rank2 < 1)) {
        setError("Le rang 2 doit être vide ou supérieur ou égal à 1.");
        return;
      }

      const maxRank = Math.max(rank1, rank2 || 0);
      const maxNeeded = Math.ceil(maxRank) + 5;

      $("scanBtn").disabled = true;
      $("scanBtn").textContent = "Scan en cours…";

      try {
        setStatus("Récupération du match principal…");

        const match = await fetchMatch(matchId);

        setStatus(`Match trouvé : ${match.homeTeam.name} vs ${match.awayTeam.name}`);

        const homeScan = await scanTeam(
          match.homeTeam.id,
          skipHomeValue,
          maxNeeded,
          match.homeTeam.name
        );

        const awayScan = await scanTeam(
          match.awayTeam.id,
          skipAwayValue,
          maxNeeded,
          match.awayTeam.name
        );

        const home = {
          ...match.homeTeam,
          ...homeScan,
          r1: valueAtRank(homeScan.events, rank1),
          r2: rank2 ? valueAtRank(homeScan.events, rank2) : null,
        };

        const away = {
          ...match.awayTeam,
          ...awayScan,
          r1: valueAtRank(awayScan.events, rank1),
          r2: rank2 ? valueAtRank(awayScan.events, rank2) : null,
        };

        $("result").innerHTML = `
          ${renderTeam(home, "Domicile", rank1, rank2)}
          <div class="vs">VS</div>
          ${renderTeam(away, "Extérieur", rank1, rank2)}
        `;

        setStatus("Scan terminé.");
      } catch (error) {
        setError(error.message || String(error));
        setStatus("");
      } finally {
        $("scanBtn").disabled = false;
        $("scanBtn").textContent = "Scanner →";
      }
    }

    function renderSkipButtons(id, getValue, setValue) {
      const container = $(id);

      function draw() {
        container.innerHTML = "";

        for (let i = 0; i <= 5; i++) {
          const btn = document.createElement("button");
          btn.textContent = i;
          btn.type = "button";

          if (getValue() === i) {
            btn.className = "active";
          }

          btn.addEventListener("click", () => {
            setValue(i);
            draw();
          });

          container.appendChild(btn);
        }
      }

      draw();
    }

    renderSkipButtons("skipHome", () => skipHomeValue, (v) => skipHomeValue = v);
    renderSkipButtons("skipAway", () => skipAwayValue, (v) => skipAwayValue = v);

    $("scanBtn").addEventListener("click", handleScan);
  </script>
</body>
</html>
