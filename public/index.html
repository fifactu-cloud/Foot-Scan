    href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter+Tight:wght@400;500;600;700&family=JetBrains+Mono:wght@400;700&display=swap"

<body>
  <div id="root"></div>

  <script type="importmap">
    {
      "imports": {
        "react": "https://esm.sh/react@18.3.1",
        "react-dom/client": "https://esm.sh/react-dom@18.3.1/client"
      }
    }
  </script>

  <script type="module">
    import React, { useState } from 'react';
    import { createRoot } from 'react-dom/client';

    const e = React.createElement;

    const VALUES = {
      goal: 1,
      goalWithAssist: 1.5,
      assist: 0.5,
      yellow: -0.5,
      secondYellow: -1.5,
      red: -1,
    };

    const LABELS = {
      goal: 'But',
      goalWithAssist: 'But + passe',
      assist: 'Passe décisive',
      yellow: 'Jaune',
      secondYellow: '2ᵉ jaune',
      red: 'Rouge direct',
    };

    function sleep(ms) {
      return new Promise((resolve) => setTimeout(resolve, ms));
    }

    async function fetchJSON(path) {
      const maxAttempts = 180;

      for (let attempt = 0; attempt < maxAttempts; attempt++) {
        const res = await fetch(
          `/api/sofa?path=${encodeURIComponent(path)}&_=${Date.now()}`,
          {
            cache: 'no-store',
          }
        );

        const text = await res.text();

        let data = null;

        try {
          data = JSON.parse(text);
        } catch {
          if (!res.ok) {
            throw new Error(`HTTP ${res.status}: ${text.slice(0, 160)}`);
          }

          throw new Error(`JSON invalide reçu: ${text.slice(0, 160)}`);
        }

        if (res.status === 202) {
          await sleep(data.retryAfter || 1000);
          continue;
        }

        if (!res.ok) {
          throw new Error(data.error || `HTTP ${res.status}`);
        }

        return data;
      }

      throw new Error(
        'Données pas encore prêtes. Lance le worker local sur ton téléphone/PC puis réessaie.'
      );
    }

    const fetchMatch = async (id) => {
      const d = await fetchJSON(`event/${id}`);
      const ev = d.event || d;

      if (!ev?.homeTeam || !ev?.awayTeam) {
        throw new Error(
          `Format inattendu. Clés: [${Object.keys(d || {})
            .slice(0, 8)
            .join(', ')}] — Sample: ${JSON.stringify(d).slice(0, 200)}`
        );
      }

      return ev;
    };

    const fetchIncidents = async (id) => {
      const d = await fetchJSON(`event/${id}/incidents`);
      return d.incidents || (Array.isArray(d) ? d : []);
    };

    const fetchTeamLast = async (teamId, page = 0) => {
      const d = await fetchJSON(`team/${teamId}/events/last/${page}`);
      return d.events || (Array.isArray(d) ? d : []);
    };

    function extractMatchId(input) {
      if (!input) return '';

      const s = input.trim();

      if (/^\d+$/.test(s)) return s;

      const m =
        s.match(/#id:(\d+)/) ||
        s.match(/\/event\/(\d+)/) ||
        s.match(/\/(\d+)(?:[/?#]|$)/);

      return m ? m[1] : s;
    }

    function parseIncidents(incidents, matchLabel, matchId) {
      const events = [];

      for (const inc of incidents) {
        const minute = inc.time;
        const added = inc.addedTime || 0;

        if (minute == null || minute > 90 || minute < 1) continue;

        const minuteLabel = added ? `${minute}+${added}'` : `${minute}'`;

        if (inc.incidentType === 'goal') {
          const hasAssist = !!inc.assist1;
          const scorer = inc.player?.name || '—';
          const assister = inc.assist1?.name || null;

          events.push({
            type: hasAssist ? 'goalWithAssist' : 'goal',
            value: hasAssist ? VALUES.goalWithAssist : VALUES.goal,
            minute,
            added,
            minuteLabel,
            match: matchLabel,
            matchId,
            detail: assister ? `${scorer} (passe : ${assister})` : scorer,
          });

          if (hasAssist) {
            events.push({
              type: 'assist',
              value: VALUES.assist,
              minute,
              added,
              minuteLabel,
              match: matchLabel,
              matchId,
              detail: `${assister} → ${scorer}`,
            });
          }
        } else if (inc.incidentType === 'card') {
          if (!inc.player?.id) continue;

          const cls = inc.incidentClass;
          let type = null;

          if (cls === 'yellow') type = 'yellow';
          else if (cls === 'yellowRed') type = 'secondYellow';
          else if (cls === 'red') type = 'red';

          if (!type) continue;

          events.push({
            type,
            value: VALUES[type],
            minute,
            added,
            minuteLabel,
            match: matchLabel,
            matchId,
            detail: inc.player.name,
          });
        }
      }

      events.sort((a, b) => {
        const tA = a.minute + (a.added || 0) / 100;
        const tB = b.minute + (b.added || 0) / 100;

        if (tB !== tA) return tB - tA;

        const order = {
          goalWithAssist: 0,
          goal: 0,
          assist: 1,
        };

        return (order[a.type] ?? 2) - (order[b.type] ?? 2);
      });

      return events;
    }

    function valueAtRank(events, rank) {
      if (rank < 1) return { value: null, sources: [] };

      if (Number.isInteger(rank)) {
        const idx = rank - 1;

        if (idx >= events.length) return { value: null, sources: [] };

        return {
          value: events[idx].value,
          sources: [events[idx]],
        };
      }

      const lo = Math.floor(rank) - 1;
      const hi = lo + 1;

      if (hi >= events.length || lo < 0) {
        return { value: null, sources: [] };
      }

      return {
        value: (events[lo].value + events[hi].value) / 2,
        sources: [events[lo], events[hi]],
      };
    }

    async function scanTeam(teamId, skip, maxNeeded) {
      const allEvents = [];
      const matchesUsed = [];

      let page = 0;
      let skipped = 0;
      let safety = 0;

      while (allEvents.length < maxNeeded && safety < 6) {
        const matches = await fetchTeamLast(teamId, page);

        const finished = matches.filter(
          (m) => m.status?.type === 'finished'
        );

        if (finished.length === 0) break;

        for (const m of finished) {
          if (skipped < skip) {
            skipped += 1;
            continue;
          }

          if (allEvents.length >= maxNeeded) break;

          const incidents = await fetchIncidents(m.id);

          const label = `${m.homeTeam.name} ${
            m.homeScore?.current ?? '-'
          }-${m.awayScore?.current ?? '-'} ${m.awayTeam.name}`;

          const evs = parseIncidents(incidents, label, m.id);

          allEvents.push(...evs);

          matchesUsed.push({
            label,
            id: m.id,
            count: evs.length,
          });
        }

        page += 1;
        safety += 1;
      }

      return {
        events: allEvents,
        matchesUsed,
      };
    }

    function SkipPicker({ label, value, setValue }) {
      return e(
        'div',
        null,
        e(
          'label',
          {
            className:
              'block text-xs uppercase tracking-widest text-stone-500 mb-2',
          },
          label
        ),
        e(
          'div',
          {
            className: 'flex gap-1',
          },
          [0, 1, 2, 3, 4, 5].map((n) =>
            e(
              'button',
              {
                key: n,
                onClick: () => setValue(n),
                className: `mono flex-1 py-2 rounded text-sm border transition ${
                  value === n
                    ? 'bg-red-600 border-red-600 text-white'
                    : 'bg-stone-900 border-stone-800 text-stone-500'
                }`,
              },
              n
            )
          )
        )
      );
    }

    function ValueCell({ label, result }) {
      const value = result?.value;
      const sources = result?.sources || [];
      const uniqueMatches = [...new Set(sources.map((s) => s.match))];

      return e(
        'div',
        {
          className: 'bg-stone-900 px-4 py-4',
        },
        e(
          'div',
          {
            className:
              'text-xs uppercase tracking-widest text-red-400 mb-1',
          },
          label
        ),
        e(
          'div',
          {
            className: 'display text-4xl text-stone-50 mb-2',
          },
          value == null ? '—' : (value > 0 ? '+' : '') + value
        ),
        sources.length > 0 &&
          e(
            'div',
            {
              className: 'border-t border-stone-800 pt-2 space-y-1',
            },
            e(
              'div',
              {
                className:
                  'text-[10px] uppercase tracking-widest text-stone-500',
              },
              uniqueMatches.length > 1 ? 'Moyenne tirée de' : 'Tiré de'
            ),
            sources.map((s, i) =>
              e(
                'div',
                {
                  key: i,
                  className: 'text-xs',
                },
                e(
                  'div',
                  {
                    className: 'text-stone-300 truncate',
                  },
                  s.match
                ),
                e(
                  'div',
                  {
                    className: 'text-stone-500 mono text-[10px]',
                  },
                  `${s.minuteLabel} · ${LABELS[s.type]} `,
                  e(
                    'span',
                    {
                      className:
                        s.value > 0 ? 'text-emerald-400' : 'text-red-400',
                    },
                    `(${s.value > 0 ? '+' : ''}${s.value})`
                  )
                )
              )
            )
          )
      );
    }

    function TeamColumn({ team, rank1, rank2, side }) {
      return e(
        'div',
        {
          className: 'border border-stone-800 rounded-lg overflow-hidden',
        },
        e(
          'div',
          {
            className:
              'bg-gradient-to-r from-stone-900 to-red-950/30 px-4 py-3 border-b border-stone-800',
          },
          e(
            'div',
            {
              className: 'text-xs uppercase tracking-widest text-stone-500',
            },
            side
          ),
          e(
            'div',
            {
              className: 'display text-2xl text-stone-50',
            },
            team.name
          )
        ),
        e(
          'div',
          {
            className: `grid ${
              rank2 ? 'grid-cols-2' : 'grid-cols-1'
            } gap-px bg-stone-800`,
          },
          e(ValueCell, {
            label: `Rang ${rank1}`,
            result: team.r1,
          }),
          rank2 &&
            e(ValueCell, {
              label: `Rang ${rank2}`,
              result: team.r2,
            })
        ),
        e(
          'div',
          {
            className: 'px-4 py-3 border-t border-stone-800',
          },
          e(
            'div',
            {
              className:
                'text-xs uppercase tracking-widest text-stone-500 mb-2',
            },
            `Matchs (${team.matchesUsed.length})`
          ),
          e(
            'div',
            {
              className: 'text-xs text-stone-400 space-y-1',
            },
            team.matchesUsed.map((m, i) =>
              e(
                'div',
                {
                  key: m.id,
                  className: 'flex justify-between gap-2',
                },
                e(
                  'span',
                  {
                    className: 'truncate',
                  },
                  `${i + 1}. ${m.label}`
                ),
                e(
                  'span',
                  {
                    className: 'text-stone-600 mono shrink-0',
                  },
                  m.count
                )
              )
            )
          )
        ),
        e(
          'div',
          {
            className:
              'px-4 py-3 border-t border-stone-800 max-h-80 overflow-y-auto',
          },
          e(
            'div',
            {
              className:
                'text-xs uppercase tracking-widest text-stone-500 mb-2',
            },
            `Événements (${team.events.length})`
          ),
          e(
            'div',
            {
              className: 'space-y-1',
            },
            team.events.map((ev, i) => {
              const rank = i + 1;

              const highlight =
                rank === Math.floor(rank1) ||
                rank === Math.ceil(rank1) ||
                (rank2 &&
                  (rank === Math.floor(rank2) ||
                    rank === Math.ceil(rank2)));

              return e(
                'div',
                {
                  key: i,
                  className: `flex items-center gap-2 px-2 py-1.5 rounded text-xs ${
                    highlight
                      ? 'bg-red-950/40 border border-red-900'
                      : ''
                  }`,
                },
                e(
                  'div',
                  {
                    className: 'mono text-stone-600 w-6 text-right',
                  },
                  `#${rank}`
                ),
                e(
                  'div',
                  {
                    className: 'mono text-stone-500 w-12',
                  },
                  ev.minuteLabel
                ),
                e(
                  'div',
                  {
                    className: 'flex-1 min-w-0',
                  },
                  e(
                    'div',
                    {
                      className: 'text-stone-200 truncate',
                    },
                    LABELS[ev.type]
                  ),
                  e(
                    'div',
                    {
                      className: 'text-stone-500 truncate',
                    },
                    ev.detail
                  )
                ),
                e(
                  'div',
                  {
                    className: `mono font-bold ${
                      ev.value > 0 ? 'text-emerald-400' : 'text-red-400'
                    }`,
                  },
                  `${ev.value > 0 ? '+' : ''}${ev.value}`
                )
              );
            })
          )
        )
      );
    }

    function App() {
      const [matchId, setMatchId] = useState('');
      const [rank1, setRank1] = useState('');
      const [rank2, setRank2] = useState('');
      const [skipHome, setSkipHome] = useState(0);
      const [skipAway, setSkipAway] = useState(0);
      const [loading, setLoading] = useState(false);
      const [error, setError] = useState(null);
      const [result, setResult] = useState(null);

      async function handleScan() {
        setError(null);
        setResult(null);

        const r1 = parseFloat(rank1);
        const r2 = rank2 ? parseFloat(rank2) : null;
        const cleanedId = extractMatchId(matchId);

        if (!cleanedId || isNaN(r1) || r1 < 1) {
          setError('Indique un matchId ou une URL SofaScore et un rang ≥ 1.');
          return;
        }

        if (r2 != null && (isNaN(r2) || r2 < 1)) {
          setError('Le rang 2 doit être vide ou supérieur à 1.');
          return;
        }

        const maxNeeded = Math.ceil(Math.max(r1, r2 ?? 0)) + 1;

        setLoading(true);

        try {
          const match = await fetchMatch(cleanedId);

          const home = match.homeTeam;
          const away = match.awayTeam;

          const [homeScan, awayScan] = await Promise.all([
            scanTeam(home.id, skipHome, maxNeeded),
            scanTeam(away.id, skipAway, maxNeeded),
          ]);

          setResult({
            home: {
              ...home,
              ...homeScan,
              r1: valueAtRank(homeScan.events, r1),
              r2: r2 ? valueAtRank(homeScan.events, r2) : null,
            },
            away: {
              ...away,
              ...awayScan,
              r1: valueAtRank(awayScan.events, r1),
              r2: r2 ? valueAtRank(awayScan.events, r2) : null,
            },
            rank1: r1,
            rank2: r2,
          });
        } catch (err) {
          setError(`Échec : ${err.message}`);
        } finally {
          setLoading(false);
        }
      }

      return e(
        'div',
        {
          className: 'min-h-screen bg-stone-950 text-stone-100',
        },
        e(
          'div',
          {
            className:
              'border-b border-stone-800 bg-gradient-to-b from-red-950/40 to-transparent',
          },
          e(
            'div',
            {
              className: 'max-w-2xl mx-auto px-5 py-
